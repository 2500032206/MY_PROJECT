<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in | Harvest & Home</title>
  <link rel="stylesheet" href="styles.css?v=20261126-1">
  <script src="app.js?v=20261126-2" defer></script>
</head>
<body class="auth-page" data-page="admin-login">
  <a class="back-home" href="index.html">← <span>Harvest & Home</span></a>
  <main class="auth-layout">
    <section class="auth-photo admin-photo"><div class="auth-photo-caption"><span class="eyebrow eyebrow-light">MARKETPLACE OVERVIEW</span><h1>One view of<br>the whole<br>harvest.</h1><p>Review all active produce and orders placed by buyers.</p></div></section>
    <section class="auth-panel"><a class="brand auth-brand" href="index.html"><span class="brand-mark">H</span><span>harvest<span class="brand-light">&home</span></span></a><div class="auth-form-wrap"><p class="section-kicker">THE ADMIN PORTAL</p><h2>Admin <em>sign in.</em></h2><p class="auth-lede">Sign in to review marketplace activity.</p>
      <form class="auth-form" data-auth-form="admin" data-mode="login">
        <label>Email address<input name="email" type="email" autocomplete="username" placeholder="admin@example.com" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" placeholder="Your password" required></label>
        <p class="form-message" aria-live="polite"></p>
        <button class="button button-green auth-submit" type="submit"><span data-submit-label>Sign in to admin</span><span aria-hidden="true">↗</span></button>
      </form>
      <p class="auth-switch">Farmer or buyer? <a href="index.html">Choose your portal →</a></p>
    </div><a class="auth-home-link" href="index.html">Back to home <span aria-hidden="true">↗</span></a></section>
  </main>
</body>
</html>
